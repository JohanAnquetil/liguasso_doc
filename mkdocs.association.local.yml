# Configuration de rédaction locale uniquement (docker compose up), jamais utilisée par la production.
# Elle reprend mkdocs.association.yml et ajoute la bulle de l'assistant Ligu'asso (projet liguasso-rag),
# servie par le chatbot lancé en local sur http://localhost:8080.
INHERIT: ./mkdocs.association.yml
extra_javascript:
  - javascripts/impression.js
  - javascripts/commentaires-local.js   # API des commentaires sur le port 8003
  - javascripts/commentaires.js
  - javascripts/propositions.js
  - http://localhost:8080/widget.js
