services:
  # Rédaction du guide ASSOCIATIONS — http://localhost:8000
  asso:
    build: { context: ., target: build }
    command: sh -c "./sync-commun.sh && mkdocs serve -f mkdocs.association.yml --dev-addr=0.0.0.0:8000 --watch commun"
    ports: ["8000:8000"]
    volumes: ["./:/projet"]

  # Rédaction du guide DÉPARTEMENTAL — http://localhost:8001
  dep:
    build: { context: ., target: build }
    command: sh -c "./sync-commun.sh && mkdocs serve -f mkdocs.departemental.yml --dev-addr=0.0.0.0:8001 --watch commun"
    ports: ["8001:8001"]
    volumes: ["./:/projet"]

  # Version publiée en HTTPS, servie par Caddy — https://<DOMAINE>/association/ et /departemental/
  # Le domaine se règle dans le fichier .env : DOMAINE=doc.exemple.fr
  prod:
    build: { context: ., target: prod }
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAINE: ${DOMAINE:?Renseigner DOMAINE dans le fichier .env}
    volumes:
      - caddy_data:/data      # certificats : à conserver
      - caddy_config:/config
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  caddy_data:
  caddy_config:
