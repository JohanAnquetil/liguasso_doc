services:
  # Les services de rédaction utilisent les fichiers mkdocs.*.local.yml : ils ajoutent la bulle de
  # l'assistant Ligu'asso, servie par le projet liguasso-rag sur http://localhost:8080. Sans ce chatbot
  # lancé, le guide fonctionne normalement, sans bulle. La production (Dockerfile) n'est pas concernée.

  # Rédaction du guide ASSOCIATIONS — http://localhost:8000
  asso:
    build: { context: ., target: build }
    command: sh -c "./sync-commun.sh && mkdocs serve -f mkdocs.association.local.yml --dev-addr=0.0.0.0:8000 --watch commun"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./:/projet"]

  # Rédaction du guide DÉPARTEMENTAL — http://localhost:8001
  dep:
    build: { context: ., target: build }
    command: sh -c "./sync-commun.sh && mkdocs serve -f mkdocs.departemental.local.yml --dev-addr=0.0.0.0:8001 --watch commun"
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["./:/projet"]

  # Bac à sable /test, en local uniquement — http://localhost:8002
  test:
    build: { context: ., target: build }
    command: sh -c "./sync-commun.sh && mkdocs serve -f mkdocs.test.yml --dev-addr=0.0.0.0:8002 --watch commun --watch overrides-test"
    ports: ["127.0.0.1:8002:8002"]
    volumes: ["./:/projet"]

  # Version publiée en HTTPS, servie par Caddy — https://<DOMAINE>/association/, /departemental/ et /test/
  # Le domaine se règle dans le fichier .env du serveur : DOMAINE=doc.exemple.fr
  # Sans .env (en local), Caddy sert https://localhost avec un certificat local.
  prod:
    build:
      context: .
      target: prod
      args:
        DOMAINE: ${DOMAINE:-localhost}   # adresse affichée en bas des PDF
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAINE: ${DOMAINE:-localhost}
    volumes:
      - caddy_data:/data      # certificats : à conserver
      - caddy_config:/config
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  caddy_data:
  caddy_config:
