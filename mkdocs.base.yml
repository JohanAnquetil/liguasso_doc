theme:
  name: material
  language: fr
  font:
    text: Inter
    code: Roboto Mono
  icon:
    logo: material/account-group
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["commun/partiels"]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - toc:
      permalink: true
      permalink_title: Lien vers cette section

plugins:
  - search:
      lang: fr
  - mkdocs-video

extra_css:
  - stylesheets/extra.css

# Bouton « PDF » et version imprimée. Attention : les fichiers *.local.yml redéfinissent
# extra_javascript (la liste est remplacée, pas complétée) et doivent le reprendre.
# Tutos vidéo : bloc « !!! video » dans les fiches -> carte, vignettes, page Tutos vidéo (hooks/videos.py)
hooks:
  - hooks/videos.py

extra_javascript:
  - javascripts/noyau.js            # règles communes aux scripts (en premier)
  - javascripts/impression.js
  - javascripts/commentaires.js
  - javascripts/editeur-fiche.js
  - javascripts/propositions.js
  - javascripts/videos.js

extra:
  generator: false
  social:
    - icon: material/email
      link: mailto:support.liguasso@laligue.org
      name: Support Ligu'asso
